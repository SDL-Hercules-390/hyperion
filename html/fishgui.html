        </form>
       </tr>
       <tr>
        <form class="send_reload" method="post" action="cgi-bin/tasks/cmd" target="syslog_null">
         <td><input type="image" src="images/startu.gif" alt="Start" title="Start"></td>
         <input type="hidden" name="cmd" value="startall">
        </form>
        <form class="send_reload" method="post" action="cgi-bin/tasks/cmd" target="syslog_null">

     </td>

     <td>
      <table border=0 cellspacing=0>
       <tr>
        <td><img src="images/dial1.gif" alt="Dial 1" title="Dial 1"></td>
        <td><img src="images/dial1.gif" alt="Dial 2" title="Dial 2"></td>

        <td><img src="images/loadonu.gif" alt="Load" title="Load"></td>
       </tr>
      </table>
     </td>
     <td>
      <table border=0 cellspacing=0>
       <tr>
        <form class="send_reload" method="post" action="/cgi-bin/tasks/cmd" target="syslog_null">

        </form>
       </tr>
      </table>
     </td>
    </tr>
   </table>
  </td>
 </tr>
</table>
<script language="Javascript">
function confirm_quit() {
  if (confirm('Are you sure you want to Power Off?\n'
     + 'This will terminate Hercules!!')) {
        // note very short delay as Hercules is exiting.....
        // .. and may not respond in time....
        reloadViewer(1);
        return true;
  } else {
        return false;
  }
}

function reloadViewer(delay) {
    // delay (ms) to allow caller to send command and log to become available
    setTimeout(function() {
        try {
            parent.frames["main"].syslogViewer.reloadSoon();
            console.log("sent");
        } catch (ignore) {
            // maybe viewer not loaded.. don't worry
        }        
    }, delay);
}

// after certain buttons we request the syslog viewer to reload 
function hookReload() {
    // only buttons in class send_reload
    document.querySelectorAll("form.send_reload").forEach(form => {
        form.addEventListener("submit", function() {
            reloadViewer(200);
        });
    });
}

window.addEventListener("load", hookReload);
</script>
