<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hercules Log Viewer</title>
<style>
html {
  height: 100%;
}

body {
  height: 100%;
  min-height: 0;
  margin: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-family: Arial, Courier, monospace;
  font-size: 14px;
}

/* Themes */
body.theme-dark {
  background: #000;
  color: #66ff99;
}

body.theme-light {
  background: #f5f5f5;
  color: #222;
}

#toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 6px 8px;
  border-bottom: 1px solid;
}

body.theme-dark #toolbar {
  background: #111;
  border-bottom-color: green;
  color: #66ff99;
}

body.theme-light #toolbar {
  background: #e9e9e9;
  border-bottom-color: gray;
  color: #222;
}

#viewerTitle {
  font-weight: bold;
  margin-right: 14px;
}

#toolbar label,
#toolbar span {
  color: inherit;
}

#toolbar input {
  width: 38px;
  padding: 2px 4px;
  border: 1px solid;
  border-radius: 3px;
  font-family: inherit;
  font-size: 14px;
}

body.theme-dark #toolbar input {
  background: #000;
  color: #66ff99;
  border-color: #333;
}

body.theme-light #toolbar input {
  background: #fff;
  color: #222;
  border-color: #aaa;
}

#toolbar input:focus {
  outline: none;
}

body.theme-dark #toolbar input:focus {
  border-color: #00aa44;
}

body.theme-light #toolbar input:focus {
  border-color: #4a90e2;
}

#toolbar button {
  padding: 4px 8px;
  border: 1px solid;
  border-radius: 3px;
  font-family: inherit;
  font-size: 14px;
}

body.theme-dark #toolbar button {
  background: #111;
  color: #66ff99;
  border-color: #333;
}

body.theme-light #toolbar button {
  background: #fff;
  color: #222;
  border-color: #aaa;
}

#log_container {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px;
}

pre {
  margin: 0;
  white-space: pre-wrap;
  word-wrap: break-word;
  line-height: 1.25;
}
</style>
</head>
<body>

<div id="toolbar">
  <span id="viewerTitle">Hercules Log Viewer</span>

  <label for="pollIntervalInput">Poll Interval:</label>

  <input type="text"
         id="pollIntervalInput"
         size="2"
         value="5"
         inputmode="numeric"
         pattern="[1-9][0-9]*"
         title="Seconds">
  (s).
  <button type="button" id="clearLogBtn">Clear Screen</button>
  Theme: 
  <button type="button" id="themeToggleBtn">Light</button>
  STATUS:
  <div id="status" style="font-weight:bold">Loading...</div>
</div>

<div id="log_container" tabindex="0">
  <pre id="log_content"></pre>
</div>
<script>
(function () {
  const STORAGE_KEY = "syslogViewerSettings";
  const THEME_KEY   = "syslogViewerTheme";

  const pollIntervalInput = document.getElementById("pollIntervalInput");
  const clearLogBtn       = document.getElementById("clearLogBtn");
  const themeToggleBtn   = document.getElementById("themeToggleBtn");

  const logContainer = document.getElementById("log_container");
  const logContent   = document.getElementById("log_content");

  let pollIntervalMs = 5000;
  let currentIndex   = null;
  let pollTimer      = null;
  let isLoading      = false;
  let reloadTimer    = null;

  function validPollInterval(v) {
    return /^[1-9][0-9]*$/.test(v);
  }

  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

      if (Number.isInteger(saved.pollInterval) && saved.pollInterval > 0) {
        pollIntervalMs = saved.pollInterval * 1000;
        pollIntervalInput.value = String(saved.pollInterval);
      }
    } catch {}
  }

  function saveSettings() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      pollInterval: Math.floor(pollIntervalMs / 1000)
    }));
  }

  function applyTheme(theme) {
    document.body.classList.remove("theme-dark", "theme-light");

    if (theme === "light") {
      document.body.classList.add("theme-light");
      themeToggleBtn.textContent = "Dark";
    } else {
      document.body.classList.add("theme-dark");
      themeToggleBtn.textContent = "Light";
      theme = "dark";
    }

    localStorage.setItem(THEME_KEY, theme);
  }

  function loadTheme() {
    const saved = localStorage.getItem(THEME_KEY) || "light";
    applyTheme(saved);
  }

  function toggleTheme() {
    const isDark = document.body.classList.contains("theme-dark");
    applyTheme(isDark ? "light" : "dark");
  }

  function shouldStickToBottom() {
    const threshold = 30;
    return (
      logContainer.scrollTop + logContainer.clientHeight >=
      logContainer.scrollHeight - threshold
    );
  }

  function scrollToTop() {
    logContainer.scrollTop = 0;
  }

  function scrollToBottom() {
    logContainer.scrollTop = logContainer.scrollHeight;
  }

  function pageScrollAmount() {
    return Math.max(50, Math.floor(logContainer.clientHeight * 0.9));
  }

  function scrollPageUp() {
    logContainer.scrollTop = Math.max(0, logContainer.scrollTop - pageScrollAmount());
  }

  function scrollPageDown() {
    logContainer.scrollTop = Math.min(
      logContainer.scrollHeight,
      logContainer.scrollTop + pageScrollAmount()
    );
  }

  function normalizeLogText(payload) {
    if (!payload || typeof payload !== "object") return "";

    if (Array.isArray(payload.syslog)) {
      return payload.syslog.join("\n");
    }
    return "";
  }

  function updateIndex(payload) {
    if (payload && typeof payload.index !== "undefined" && payload.index !== null) {
      currentIndex = payload.index;
    }
  }

  function fetchJson(url) {
    // update status after every fetch
    s = document.getElementById("status");
    return fetch(url, {
      method: "GET",
      cache: "no-store"
    })
    .then(function (response) {
      
      if (!response.ok) {
        s.style.color = "#FFBF00";  // amber
        s.textContent="ERROR " + response.status;
        throw new Error("HTTP " + response.status);
      }
      s.style.color = "green";
      s.textContent="ONLINE";
      return response.json();
    })
    .catch(function (err) {
      s.style.color = "red";
      s.textContent="OFFLINE";
      throw new Error("Host Unavailable");
    });
  }

  async function loadInitialLog() {
    if (isLoading) return;
    isLoading = true;

    const stick = shouldStickToBottom();

    try {
      const payload = await fetchJson("/cgi-bin/api/v1/syslog?msgcount=0");
      const text = normalizeLogText(payload);

      logContent.textContent = text;
      updateIndex(payload);

      if (stick || text.length > 0) {
        scrollToBottom();
      }
    } catch (err) {
      console.log("Initial syslog load failed");
    } finally {
      isLoading = false;
    }
  }

  async function pollForUpdates() {
    if (isLoading) return;

    if (currentIndex === null) {
      await loadInitialLog();
      return;
    }

    isLoading = true;
    const stick = shouldStickToBottom();

    try {
      const payload = await fetchJson(
        "/cgi-bin/api/v1/syslog?index=" + encodeURIComponent(currentIndex)
      );

      const text = normalizeLogText(payload);
      updateIndex(payload);

      if (text) {
        if (logContent.textContent) {
          logContent.textContent += "\n" + text;
        } else {
          logContent.textContent = text;
        }

        if (stick) {
          scrollToBottom();
        }
      }
    } catch (err) {
      console.log("Syslog poll failed");
    } finally {
      isLoading = false;
    }
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      pollForUpdates();
    }, pollIntervalMs);
  }

  function applyPollIntervalFromInput() {
    const pollValue = pollIntervalInput.value.trim();

    if (!validPollInterval(pollValue)) {
      alert("Poll Interval must be > 0");
      pollIntervalInput.value = String(Math.floor(pollIntervalMs / 1000));
      pollIntervalInput.focus();
      return false;
    }

    pollIntervalMs = Number(pollValue) * 1000;
    saveSettings();
    startPolling();
    return true;
  }

  function reloadSoon() {
    if (reloadTimer) {
      clearTimeout(reloadTimer);
    }

    reloadTimer = setTimeout(function () {
      currentIndex = null;
      loadInitialLog();
    }, 300);
  }

  function clearScreen() {
    logContent.textContent = "";
    logContainer.scrollTop = 0;
  }

  pollIntervalInput.addEventListener("change", function () {
    applyPollIntervalFromInput();
    logContainer.focus();
  });

  pollIntervalInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      applyPollIntervalFromInput();
      logContainer.focus();
    }
  });

  clearLogBtn.addEventListener("click", function () {
    clearScreen();
    logContainer.focus();
  });

  themeToggleBtn.addEventListener("click", function () {
    toggleTheme();
    logContainer.focus();
  });

  document.addEventListener("keydown", function (e) {
    const active = document.activeElement;
    const tag = (active && active.tagName) || "";
    const isEditingField =
      tag === "INPUT" || tag === "TEXTAREA" || (active && active.isContentEditable);

    if (isEditingField) {
      return;
    }

    if (e.key === "Home") {
      e.preventDefault();
      scrollToTop();
      return;
    }

    if (e.key === "End") {
      e.preventDefault();
      scrollToBottom();
      return;
    }

    const key = e.key.toLowerCase();

    if ((e.metaKey && e.key === "ArrowUp") || (e.ctrlKey && key === "u")) {
      e.preventDefault();
      scrollPageUp();
      return;
    }

    if ((e.metaKey && e.key === "ArrowDown") || (e.ctrlKey && key === "d")) {
      e.preventDefault();
      scrollPageDown();
      return;
    }
  });

  logContainer.addEventListener("click", function () {
    logContainer.focus();
  });

  window.syslogViewer = {
    async initialize() {
      loadTheme();
      loadSettings();
      await loadInitialLog();
      startPolling();
    },

    async reloadAll() {
      currentIndex = null;
      await loadInitialLog();
    },

    reloadSoon: reloadSoon,
    clearScreen: clearScreen,
    scrollToTop: scrollToTop,
    scrollToBottom: scrollToBottom,
    scrollPageUp: scrollPageUp,
    scrollPageDown: scrollPageDown
  };

  loadTheme();
  loadSettings();

  loadInitialLog().then(function () {
    startPolling();
    logContainer.focus();
  });
})();
</script>
</body>
</html>
